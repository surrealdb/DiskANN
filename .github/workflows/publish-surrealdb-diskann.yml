# Publishes SurrealDB's build of `diskann` to crates.io as `surrealdb-diskann`.
#
# Trigger: push a tag `surrealdb-diskann-v{major}.{minor}.{patch}` at the tip of the matching
# `release/v{major}.{minor}.{patch}` branch. The tag pattern deliberately does not match the
# upstream `v*` tags that `publish.yml` publishes the whole workspace on.
#
# Only `surrealdb-diskann` is published. Its dependencies are the upstream crates.io releases of
# `diskann-utils`, `diskann-vector` and `diskann-wide`, which this repository never publishes.
#
# Two jobs, so that no code compiled from the dependency tree runs where the token is:
#   - `verify` checks the tag and builds the packaged crate against the crates.io releases with
#     default features, all features and no default features. It has no access to the token.
#   - `publish` runs on a fresh runner after `verify` passes and only uploads
#     (`cargo publish --no-verify`), so it compiles nothing and runs no build script.
#
# Requires CARGO_REGISTRY_TOKEN. Within this workflow only the `publish` job reads it, but as an
# organization or repository secret it is readable by any workflow in this repository; the
# `crates-io` environment does not restrict it. GitHub creates that environment, without
# protection rules, on the first run that references it, so required reviewers only gate a
# release if an admin configures them before its tag is pushed.
#
# Rust toolchain version is read from rust-toolchain.toml.

name: Publish surrealdb-diskann to crates.io

on:
  push:
    tags:
      - 'surrealdb-diskann-v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_BACKTRACE: 1

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  verify:
    name: Verify surrealdb-diskann
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup show

      - name: Verify version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#surrealdb-diskann-v}"
          CRATE_VERSION=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "surrealdb-diskann") | .version')
          if [ "$TAG_VERSION" != "$CRATE_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match surrealdb-diskann version ($CRATE_VERSION)"
            exit 1
          fi
          echo "TAG_VERSION=$TAG_VERSION" >> "$GITHUB_ENV"

      - name: Verify tag is the tip of its release branch
        run: |
          BRANCH="release/v$TAG_VERSION"
          BRANCH_SHA=$(git ls-remote --exit-code origin "refs/heads/$BRANCH" | cut -f1) || {
            echo "::error::Branch $BRANCH does not exist"
            exit 1
          }
          if [ "$BRANCH_SHA" != "$(git rev-parse HEAD)" ]; then
            echo "::error::Tag must point to the tip of $BRANCH ($BRANCH_SHA)"
            exit 1
          fi

      - name: Package and verify (default features)
        run: cargo package --locked -p surrealdb-diskann

      - name: Package and verify (all features)
        run: cargo package --locked -p surrealdb-diskann --all-features

      - name: Package and verify (no default features)
        run: cargo package --locked -p surrealdb-diskann --no-default-features

  publish:
    name: Publish surrealdb-diskann
    needs: verify
    runs-on: ubuntu-latest
    environment: crates-io

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup show

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --no-verify -p surrealdb-diskann
